name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Initialize Capacitor Android Project
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        mkdir -p www
        cp -r index.html css js assets manifest.json service-worker.js www/
        echo '{"appId":"com.lettercraft.ai","appName":"LetterCraft AI","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
        npx cap add android
        npx cap sync

    - name: Fix Kotlin Dependency Conflict
      run: |
        echo 'kotlin.stdlib.default.dependency=false' >> android/gradle.properties
        sed -i 's/implementation \"org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.6.21\"//g' android/app/build.gradle

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build Android APK with Gradle
      run: cd android && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: lettercraft-debug-apk
        path: android/app/build/outputs/apk/debug/*.apk
