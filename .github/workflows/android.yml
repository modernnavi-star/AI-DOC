name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Initialize Capacitor Android Project
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli
        echo '{"appId":"com.lettercraft.ai","appName":"LetterCraft AI","webDir":".","bundledWebRuntime":false}' > capacitor.config.json
        npx cap add android
        npx cap sync

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build Android APK with Gradle
      run: cd android && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: lettercraft-debug-apk
        path: android/app/build/outputs/apk/debug/*.apk
